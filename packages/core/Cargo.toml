[package]
name = "lgg-core"
version = "0.1.2"
edition = "2024"

[features]
default = ["language", "rule", "fastmap"]
sound = []
word = ["sound"]
rule = ["word"]
dictionary = ["word", "dep:cc-traits"]
fastmap = ["word", "dep:foldhash"]
language = ["dictionary"]

[dependencies]
cc-traits = {version="2.0.0", optional=true}
foldhash = {version="0.2.0", optional=true}
